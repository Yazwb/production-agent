<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>工业知识助手</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            max-width: 980px;
            margin: 32px auto;
            padding: 0 18px;
            color: #172033;
            background: #f6f8fb
        }

        h1 {
            margin-bottom: 4px
        }

        .muted {
            color: #667085
        }

        .grid {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 18px
        }

        .panel {
            background: #fff;
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            padding: 18px;
            margin: 16px 0
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 7px 0 12px;
            border: 1px solid #cdd5df;
            border-radius: 6px;
            font: inherit
        }

        textarea {
            min-height: 120px
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 15px;
            background: #175cd3;
            color: #fff;
            cursor: pointer
        }

        button.danger {
            background: #b42318;
            margin-left: 8px
        }

        pre {
            white-space: pre-wrap;
            background: #f8fafc;
            padding: 14px;
            border-radius: 6px;
            min-height: 100px
        }

        .doc {
            border-top: 1px solid #eaecf0;
            padding: 10px 0;
            font-size: 14px
        }

        .source {
            border-left: 3px solid #84adff;
            padding: 8px 12px;
            margin: 8px 0;
            background: #f8fbff;
            font-size: 13px
        }

        @media(max-width:760px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <h1>工业知识助手</h1>
    <p class="muted">热风烘干设备知识问答 MVP</p>
    <div class="grid">
        <aside>
            <section class="panel">
                <h3>导入知识库</h3><input id="file" type="file" accept=".pdf,.docx,.txt,.md"><select id="docDomain">
                    <option value="equipment">设备</option>
                    <option value="process">工艺</option>
                    <option value="quality">质量</option>
                </select><button onclick="upload()">上传并索引</button>
                <pre id="uploadResult"></pre>
            </section>
            <section class="panel">
                <h3>文档列表</h3>
                <div id="documents">加载中...</div>
            </section>
        </aside>
        <main>
            <section class="panel">
                <h3>问答</h3><select id="domain">
                    <option value="auto">自动判断领域</option>
                    <option value="equipment">设备</option>
                    <option value="process">工艺</option>
                    <option value="quality">质量</option>
                </select><textarea id="question" placeholder="例如：热风烘干设备温度过高应该如何排查？"></textarea><button
                    onclick="ask()">发送问题</button>
                <div id="answer"></div>
            </section>
        </main>
    </div>
    <script>async function upload() { const file = document.getElementById('file').files[0]; if (!file) { alert('请选择文件'); return } const form = new FormData(); form.append('file', file); form.append('domain', document.getElementById('docDomain').value); const r = await fetch('/api/v1/documents/upload', { method: 'POST', body: form }); document.getElementById('uploadResult').textContent = JSON.stringify(await r.json(), null, 2); loadDocuments() } async function loadDocuments() { const r = await fetch('/api/v1/documents'); const data = await r.json(); document.getElementById('documents').innerHTML = data.items.map(d => `<div class="doc"><strong>${d.filename}</strong><br>领域：${d.domain}，分块：${d.chunk_count}<button class="danger" onclick="removeDoc('${d.id}')">删除</button></div>`).join('') || '暂无文档' } async function removeDoc(id) { await fetch('/api/v1/documents/' + id, { method: 'DELETE' }); loadDocuments() } async function ask() { const question = document.getElementById('question').value; const r = await fetch('/api/v1/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question, domain: document.getElementById('domain').value }) }); const data = await r.json(); document.getElementById('answer').innerHTML = `<h4>回答 · ${data.agent || ''}</h4><pre>${data.answer || data.detail}</pre><h4>引用来源</h4>${(data.sources || []).map(s => `<div class="source">${s.filename} · 第${s.page_number}页 · ${s.excerpt}</div>`).join('')}` } loadDocuments();</script>
</body>

</html>
